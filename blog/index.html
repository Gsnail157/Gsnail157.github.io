---
layout: null
---
<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="../layouts/templates.js"></script>
        <site-head title="Blog - Gary Wang"></site-head>
    </head>
    <body>
        <site-header></site-header>
        <div class="content">
            <main class="blog-page">
                <h1>Blog</h1>
                <p class="subtitle">All posts</p>
             
                <div class="post-grid">
                  {% for post in collections.posts | reverse %}
                    <a href="{{ post.url }}" class="post-card">
                      {% if post.data.image %}
                        <img src="{{ post.data.image }}" alt="{{ post.data.title }}" />
                      {% else %}
                        <img src="/styles/placeholder.jpg" alt="No image" />
                      {% endif %}
                      <div class="post-card-body">
                        <p class="post-card-date">{{ post.date | date: "%B %d, %Y" }}</p>
                        <h2 class="post-card-title">{{ post.data.title }}</h2>
                      </div>
                    </a>
                  {% endfor %}
                </div>
              </main>
        </div>
    </body>
</html>
